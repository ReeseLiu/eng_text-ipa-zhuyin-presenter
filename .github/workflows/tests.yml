name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No npm packages: the JS tests use Node built-ins only.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Includes the Py/JS contract tests and the app.js flow test; they fail (not skip) without Node.
      - name: Run tests
        run: python -m unittest discover -s tests -v
